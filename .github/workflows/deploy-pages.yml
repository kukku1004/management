name: Deploy Management to GitHub Pages

on:
  push:
    branches:
      - codex/management-access
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /management/
          VITE_GOOGLE_CLIENT_ID: 561236899589-hr7danecihp38b009nm3sqo7tb2cd6im.apps.googleusercontent.com
          VITE_FIREBASE_API_KEY: AIzaSyBHd9oDRchzOYFPvxCRGZHQPWmgpsLbiZA
          VITE_FIREBASE_AUTH_DOMAIN: osstem-management.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: osstem-management
          VITE_FIREBASE_STORAGE_BUCKET: osstem-management.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 120352382740
          VITE_FIREBASE_APP_ID: 1:120352382740:web:4e5421c045455bd83f2c01
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
